name: Desktop Builds

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

jobs:
  macos:
    name: macOS Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -S . -B build-release
          -DCMAKE_BUILD_TYPE=Release
          -DIENGINE_WITH_EDITOR=OFF
          -DIENGINE_EMBED_LUA_SCRIPTS=ON

      - name: Build
        run: cmake --build build-release --config Release --parallel

      - name: Ad-hoc sign macOS binary
        run: codesign --force --deep --sign - build-release/bin/iEngineV2

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: iEngineV2-macos
          path: |
            build-release/bin/**

  windows:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -S . -B build-release
          -DCMAKE_BUILD_TYPE=Release
          -DIENGINE_WITH_EDITOR=OFF
          -DIENGINE_EMBED_LUA_SCRIPTS=ON

      - name: Build
        run: cmake --build build-release --config Release --parallel

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: iEngineV2-windows
          path: |
            build-release/bin/**
