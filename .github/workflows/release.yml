name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Ad-hoc sign macOS binary
        run: codesign --force --deep --sign - build/bin/iEngineV2

      - name: Package macOS artifact
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/bin dist/iEngineV2-macos.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: iEngineV2-macos
          path: dist/iEngineV2-macos.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Package Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path build/bin/* -DestinationPath dist/iEngineV2-windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: iEngineV2-windows
          path: dist/iEngineV2-windows.zip

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/iEngineV2-macos/iEngineV2-macos.zip
            dist/iEngineV2-windows/iEngineV2-windows.zip
          generate_release_notes: true
