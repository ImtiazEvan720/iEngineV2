plugins {
    id "com.android.application"
}

def generatedAssetsDir = file("$buildDir/generated/engineAssets")

tasks.register("syncEngineAssets", Sync) {
    into generatedAssetsDir
    from("../../config.xml")
    from("../../Assets") {
        into "Assets"
    }
}

android {
    namespace "com.imtiazevan.ienginev2"
    compileSdkVersion 35
    ndkVersion "30.0.14904198"

    defaultConfig {
        applicationId "com.imtiazevan.ienginev2"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-23", "-DANDROID_STL=c++_shared"
                abiFilters "arm64-v8a"
            }
        }
    }

    sourceSets {
        main {
            assets.srcDirs += generatedAssetsDir
        }
    }

    preBuild.dependsOn("syncEngineAssets")

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "4.1.2"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
        }
    }
}
