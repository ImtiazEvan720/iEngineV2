plugins {
    id "com.android.application"
}

def generatedAssetsDir = file("$buildDir/generated/engineAssets")
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains("release")
}

tasks.register("syncEngineAssets", Sync) {
    into generatedAssetsDir
    from("../../config.xml")
    from("../../Assets") {
        into "Assets"
        if (releaseTaskRequested) {
            exclude "Scripts/**"
        }
    }
    from("../../build/bin/Assets/Levels") {
        into "Assets/Levels"
    }
    from("../../build/bin/Assets/Prefabs") {
        into "Assets/Prefabs"
    }
}

android {
    namespace "com.imtiazevan.ienginev2"
    compileSdkVersion 35
    ndkVersion "30.0.14904198"

    defaultConfig {
        applicationId "com.imtiazevan.ienginev2"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-23",
                    "-DANDROID_STL=c++_shared",
                    "-DIENGINE_EMBED_LUA_SCRIPTS=${releaseTaskRequested ? "ON" : "OFF"}"
                abiFilters "arm64-v8a"
            }
        }
    }

    sourceSets {
        main {
            assets.srcDirs += generatedAssetsDir
        }
    }

    preBuild.dependsOn("syncEngineAssets")

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "4.1.2"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
        }
    }
}
